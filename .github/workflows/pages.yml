# Publica o site do www (index.html, /dev, robots, sitemap, CNAME) no GitHub Pages.
# Existe porque o publicador automático do Pages baixa os submódulos, e
# FechaCaixa-back e FechaCaixa-front são privados: o build quebrava.
name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Separa só os arquivos do site
        run: |
          mkdir _site
          cp -r index.html dev robots.txt sitemap.xml CNAME _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
